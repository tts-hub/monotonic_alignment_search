name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: ./.github/actions/setup-uv
      - name: Lint check
        run: uv run --only-dev prek run --all-files
        env:
          SKIP: ty
      - name: Type check
        run: uv run --extra cpu ty check
